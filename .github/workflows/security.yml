name: Security

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Scan for committed secrets
        run: npm run security:scan -- --history

      - name: Check types and unit tests
        run: npm run check && npm test

      - name: Build
        run: npm run build && npm run security:scan -- --client

      - name: Audit dependencies
        run: npm audit --audit-level=low

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: lapor_aman_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: CHANGE_ME_CI_ONLY
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://test_user:CHANGE_ME_CI_ONLY@localhost:5432/lapor_aman_test
      AI_ENABLED: 'false'
      PUBLIC_BASE_URL: http://localhost:5173
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test isolation, authorization, and concurrency
        run: node ./node_modules/vitest/vitest.mjs run --config vitest.integration.config.ts
